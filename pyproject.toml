[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-project-extractor"
version = "1.0.0"
description = "Extract capital projects from public-sector budget PDFs using Z.AI GLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Budget Project Extractor" }]
dependencies = [
  "zai-sdk>=0.2.3",
  "requests>=2.31",
  "httpx>=0.27",
  "PyMuPDF>=1.24",
  "pydantic>=2.7",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
budget-extractor = "budget_extractor.cli:main"

[tool.setuptools.packages.find]
include = ["budget_extractor*"]

[tool.setuptools.package-data]
budget_extractor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
